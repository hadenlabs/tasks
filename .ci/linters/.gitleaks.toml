title = "gitleaks config"

minVersion = "v8.25.0"

#######################################
# Global allowlist
#######################################

[allowlist]

description = "Ignored paths and files"
files = [
  '''^\.?gitleaks.toml$''',
  '''(.*?)(png|jpg|gif|doc|docx|pdf|bin|xls|pyc|zip)$''',
  '''(go.mod|go.sum)$''',
]

paths = [
  '''gitleaks\.toml''',
  '''(^|/)linters/\.gitleaks\.toml$''',
  '''^\.gitleaks\.toml$''',
  '''^\.gitleaks.toml$''',
  '''^linters/\.gitleaks\.toml$''',
  '''secrets\.enc\.yaml$''',
  '''^vendor/''',
  '''^bower_components/''',
  '''^public/''',
  '''^theme/''',
  '''^node_modules/''',
  '''(?i).*\.(jpg|gif|png|doc|pdf|bin|mp3|mp4|mov|ttf|woff|woff2|eot|lock)$''',
  '''^\.gitignore$''',
  '''^yarn\.lock$''',
  '''^package-lock\.json$''',
  '''FOOEYEDONTEXIST''',
  '''README\.md$''',
]


#######################################
# AWS
#######################################

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''(AKIA|ASIA|A3T[A-Z0-9]|AGPA|AIDA|AROA|AIPA|ANPA|ANVA)[A-Z0-9]{16}'''
tags = ["key", "AWS"]

[[rules.allowlists]]
description = "Fake AWS values"
regexes = ['''AIDAQEAAAAAAAAAAAAAA''']


[[rules]]
id = "aws-credentials"
description = "AWS credentials"
regex = '''(?i)(aws_access_key_id|aws_secret_access_key)\s*=\s*['"]?[A-Za-z0-9/+=]{20,40}['"]?'''
tags = ["key", "AWS"]


[[rules]]
id = "aws-secret-key"
description = "AWS Secret Key"
regex = '''(?i)aws(.{0,20})?['"][0-9a-zA-Z/+=]{40}['"]'''
tags = ["key", "AWS"]


#######################################
# Cloud / SaaS tokens
#######################################

[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
tags = ["key", "Google"]


[[rules]]
id = "google-oauth"
description = "Google OAuth"
regex = '''[0-9]+-[0-9a-z_]{32}\.apps\.googleusercontent\.com'''
tags = ["key", "Google", "OAuth"]


[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth Access Token"
regex = '''ya29\.[0-9A-Za-z\-_]+'''
tags = ["key", "Google"]


[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[0-9a-zA-Z]{10,48}'''
tags = ["key", "Slack"]


[[rules]]
id = "slack-webhook"
description = "Slack Webhook"
regex = '''https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8}/B[a-zA-Z0-9_]{8}/[a-zA-Z0-9_]{24}'''
tags = ["key", "Slack"]


#######################################
# GitHub
#######################################

[[rules]]
id = "github-token"
description = "GitHub Token"
regex = '''gh[pousr]_[A-Za-z0-9_]{36,255}'''
tags = ["key", "Github"]


#######################################
# Private keys
#######################################

[[rules]]
id = "ec-private-key"
description = "EC Private Key"
regex = '''-----BEGIN EC PRIVATE KEY-----'''
tags = ["key"]


[[rules]]
id = "rsa-private-key"
description = "RSA Private Key"
regex = '''-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----'''
tags = ["key"]


#######################################
# Payment providers
#######################################

[[rules]]
id = "stripe-live-key"
description = "Stripe Live Key"
regex = '''['"]?(sk|rk)_live_[0-9a-zA-Z]{24,}'''
tags = ["key", "Stripe"]


#######################################
# Generic secrets
#######################################

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*['"][0-9a-zA-Z_\-]{20,120}['"]'''
tags = ["key"]


[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = '''(?i)(secret|token|password|passwd|pwd)\s*[:=]\s*['"][^'"]{8,120}['"]'''
tags = ["secret"]


#######################################
# URLs with credentials
#######################################

[[rules]]
id = "password-in-url"
description = "Password in URL"
regex = '''[a-zA-Z]{3,10}://[^/\s:@]{3,20}:[^/\s:@]{3,20}@'''
tags = ["url", "secret"]


#######################################
# Environment variables
#######################################

[[rules]]
id = "environment-secret"
description = "Environment Secret"
regex = '''(?i)(apikey|secret|token|password|passwd|pwd)\s*=\s*[0-9a-zA-Z._{}\-]{4,120}'''
tags = ["env"]

[[rules.allowlists]]
description = "Fake environment values"
regexes = ['''PASSWORD=XXXXXX''', '''password={password}''', '''host=HOST''', '''token = string''']


#######################################
# Terraform / Infra
#######################################

[[rules]]
id = "terraform-sensitive-values"
description = "Terraform Sensitive Values"
regex = '''(?i)(secret|password|token|key)\s*=\s*["'][^"']{8,120}["']'''
tags = ["terraform"]


#######################################
# High entropy strings
#######################################

[[rules]]
id = "high-entropy-secret"
description = "High Entropy Secret"
regex = '''[0-9a-zA-Z_\-!]{20,120}'''
tags = ["entropy"]
entropy = 4.3


#######################################
# Sensitive files
#######################################

[[rules]]
id = "credential-files"
description = "Credential files"
path = '''(?i)(id_rsa|passwd|\.pgpass|credentials)$'''
tags = ["files"]


[[rules]]
id = "key-files"
description = "Key files"
path = '''(?i).*\.(pem|ppk|key)$'''
tags = ["files"]

[[rules.allowlists]]
description = "Ignore test keys"
paths = ['''.*-test.*''']

